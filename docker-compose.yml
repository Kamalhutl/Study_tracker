x-app-env: &app-env
  DEBUG: ${DEBUG:-0}
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
  SECRET_KEY: ${SECRET_KEY:-dev-only-not-a-real-secret-please-change-me}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  DB_NAME: ${DB_NAME:-study_tracker}
  DB_USER: ${DB_USER:-study_tracker}
  DB_PASSWORD: ${DB_PASSWORD:-study_tracker}
  DB_HOST: db
  DB_PORT: ${DB_PORT:-5432}
  REDIS_URL: redis://redis:6379
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-study_tracker}
      POSTGRES_USER: ${DB_USER:-study_tracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-study_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-study_tracker} -d ${DB_NAME:-study_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: dev
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      <<: *app-env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    command: celery -A config worker -l info -Q default,scraping,notifications --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    environment:
      <<: *app-env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Uses Celery's default file scheduler because django-celery-beat is intentionally
  # not installed in Phase 1. Switch to `--scheduler django_celery_beat` when it's added.
  beat:
    build:
      context: .
      target: dev
    command: celery -A config beat -l info
    environment:
      <<: *app-env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata: