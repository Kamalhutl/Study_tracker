name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: study_tracker
          POSTGRES_USER: study_tracker
          POSTGRES_PASSWORD: study_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study_tracker -d study_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: study_tracker
      DB_USER: study_tracker
      DB_PASSWORD: study_tracker
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379
      SECRET_KEY: ci-only-not-secret-please-change-me
      SSR_SERVICE_TOKEN: ci-dummy-ssr-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Create venv and install dev requirements
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements/dev.txt
      - name: Apply migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: .venv/bin/python manage.py migrate --noinput
      - name: Run gates
        run: make gates

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Run web gates
        run: make web-gates

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: study_tracker
          POSTGRES_USER: study_tracker
          POSTGRES_PASSWORD: study_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study_tracker -d study_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_NAME: study_tracker
      DB_USER: study_tracker
      DB_PASSWORD: study_tracker
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379
      SECRET_KEY: ci-only-not-secret-please-change-me
      SSR_SERVICE_TOKEN: ci-dummy-ssr-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install Python deps
        run: pip install -r requirements/dev.txt
      - name: Install web deps
        run: pnpm --dir web install --frozen-lockfile
      - name: Install smoke prerequisites
        run: sudo apt-get update && sudo apt-get install -y netcat-openbsd lsof
      - name: Run web smoke
        run: make web-smoke
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-server-logs
          path: var/smoke/
          retention-days: 7
          if-no-files-found: ignore