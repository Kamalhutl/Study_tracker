openapi: 3.0.3
info:
  title: Job + Exam Portal API
  version: 0.1.0
  description: 'Phase 1 MVP: accounts + JWT auth + audit log core.'
paths:
  /api/v1/auth/firebase-token/:
    post:
      operationId: api_v1_auth_firebase_token_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FcmTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FcmTokenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FcmToken'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '205':
          description: Refresh token blacklisted
        '400':
          description: Invalid or expired refresh token
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '401':
          description: Not authenticated
    patch:
      operationId: api_v1_auth_me_partial_update
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '401':
          description: Not authenticated
  /api/v1/auth/password/change/:
    post:
      operationId: api_v1_auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Password changed, all tokens blacklisted
        '400':
          description: Validation error
  /api/v1/auth/refresh/:
    post:
      operationId: api_v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotatingRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RotatingRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RotatingRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatingRefresh'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
  /api/v1/companies/:
    get:
      operationId: api_v1_companies_list
      parameters:
      - in: query
        name: has_open_jobs
        schema:
          type: boolean
      - in: query
        name: industry
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyListList'
          description: ''
  /api/v1/companies/{slug}/:
    get:
      operationId: api_v1_companies_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDetail'
          description: ''
  /api/v1/companies/{slug}/jobs/:
    get:
      operationId: api_v1_companies_jobs_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobListList'
          description: ''
  /api/v1/exams/:
    get:
      operationId: api_v1_exams_list
      parameters:
      - in: query
        name: allow_final_year
        schema:
          type: boolean
      - in: query
        name: applications_open
        schema:
          type: boolean
      - in: query
        name: body
        schema:
          type: string
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: level
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search (trigram)
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: upcoming_within_days
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExamListList'
          description: ''
  /api/v1/exams/{slug}/:
    get:
      operationId: api_v1_exams_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamDetail'
          description: ''
  /api/v1/exams/{slug}/save/:
    post:
      operationId: api_v1_exams_save_create
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_v1_exams_save_destroy
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/exams/calendar/:
    get:
      operationId: api_v1_exams_calendar_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
          description: ''
  /api/v1/exams/cycles/:
    get:
      operationId: api_v1_exams_cycles_list
      parameters:
      - in: query
        name: exam
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - admit_card_out
          - announced
          - applications_closed
          - applications_open
          - cancelled
          - exam_conducted
          - notification_out
          - postponed
          - result_out
        description: |-
          * `announced` - Announced
          * `notification_out` - Notification Out
          * `applications_open` - Applications Open
          * `applications_closed` - Applications Closed
          * `admit_card_out` - Admit Card Out
          * `exam_conducted` - Exam Conducted
          * `result_out` - Result Out
          * `cancelled` - Cancelled
          * `postponed` - Postponed
      - in: query
        name: year
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExamCycleList'
          description: ''
  /api/v1/exams/cycles/{id}/:
    get:
      operationId: api_v1_exams_cycles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamCycle'
          description: ''
  /api/v1/exams/saved/:
    get:
      operationId: api_v1_exams_saved_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExamListList'
          description: ''
  /api/v1/jobs/:
    get:
      operationId: api_v1_jobs_list
      parameters:
      - in: query
        name: company
        schema:
          type: array
          items:
            type: string
        description: Company slug
      - in: query
        name: department
        schema:
          type: string
        description: icontains
      - in: query
        name: has_apply_url
        schema:
          type: boolean
        description: Boolean
      - in: query
        name: job_type
        schema:
          type: array
          items:
            type: string
        description: Multi-value
      - in: query
        name: location
        schema:
          type: string
        description: icontains
      - in: query
        name: ordering
        schema:
          type: string
        description: posted_at, -posted_at, created_at, -created_at, title
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: posted_after
        schema:
          type: string
        description: ISO date
      - in: query
        name: posted_within_days
        schema:
          type: integer
        description: Integer
      - in: query
        name: q
        schema:
          type: string
        description: Search
      - in: query
        name: work_mode
        schema:
          type: array
          items:
            type: string
        description: Multi-value
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobListList'
          description: ''
  /api/v1/jobs/{id}/:
    get:
      operationId: api_v1_jobs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
          description: ''
  /api/v1/jobs/{id}/report/:
    post:
      operationId: api_v1_jobs_report_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobReportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobReportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobReportRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReport'
          description: ''
        '400':
          description: Validation error
  /api/v1/jobs/{id}/save/:
    post:
      operationId: api_v1_jobs_save_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
          description: ''
    delete:
      operationId: api_v1_jobs_save_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/jobs/by-slug/{slug}/:
    get:
      operationId: api_v1_jobs_by_slug_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
          description: ''
  /api/v1/jobs/facets/:
    get:
      operationId: api_v1_jobs_facets_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacetsResponse'
          description: ''
  /api/v1/jobs/saved/:
    get:
      operationId: api_v1_jobs_saved_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSavedJobList'
          description: ''
  /healthz:
    get:
      operationId: healthz_retrieve
      description: 'Liveness: the process is up. No dependencies touched.'
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: 'Liveness: process is up'
  /readyz:
    get:
      operationId: readyz_retrieve
      description: 'Readiness: DB responds to SELECT 1 and Redis pings. 503 if either
        fails.'
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: 'Readiness: DB + Redis healthy'
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    BodyTypeEnum:
      enum:
      - central
      - state
      - banking
      - railway
      - defence
      - testing_agency
      type: string
      description: |-
        * `central` - Central
        * `state` - State
        * `banking` - Banking
        * `railway` - Railway
        * `defence` - Defence
        * `testing_agency` - Testing Agency
    CalendarEvent:
      type: object
      properties:
        date:
          type: string
          format: date
        event_type:
          type: string
        exam_name:
          type: string
        exam_slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        cycle_label:
          type: string
        stage_name:
          type: string
          nullable: true
        is_tentative:
          type: boolean
        official_url:
          type: string
          format: uri
      required:
      - cycle_label
      - date
      - event_type
      - exam_name
      - exam_slug
      - is_tentative
      - official_url
      - stage_name
    Category185Enum:
      enum:
      - civil_services
      - banking
      - railway
      - ssc
      - teaching
      - defence
      - engineering
      - medical
      - law
      - state_psc
      - other
      type: string
      description: |-
        * `civil_services` - Civil Services
        * `banking` - Banking
        * `railway` - Railway
        * `ssc` - SSC
        * `teaching` - Teaching
        * `defence` - Defence
        * `engineering` - Engineering
        * `medical` - Medical
        * `law` - Law
        * `state_psc` - State PSC
        * `other` - Other
    CompanyDetail:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 280
          pattern: ^[-a-zA-Z0-9_]+$
        domain:
          type: string
          maxLength: 255
        logo_url:
          type: string
          format: uri
          maxLength: 500
        industry:
          type: string
          maxLength: 120
        hq_location:
          type: string
          maxLength: 255
        size_bucket:
          type: string
          maxLength: 40
        open_jobs_count:
          type: integer
          readOnly: true
        description:
          type: string
        linkedin_url:
          type: string
          format: uri
          maxLength: 500
        career_url:
          type: string
          format: uri
          maxLength: 1000
        is_verified:
          type: boolean
        last_checked_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - domain
      - last_checked_at
      - name
      - open_jobs_count
      - slug
    CompanyFacet:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        count:
          type: integer
      required:
      - count
      - name
      - slug
    CompanyList:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 280
          pattern: ^[-a-zA-Z0-9_]+$
        domain:
          type: string
          maxLength: 255
        logo_url:
          type: string
          format: uri
          maxLength: 500
        industry:
          type: string
          maxLength: 120
        hq_location:
          type: string
          maxLength: 255
        size_bucket:
          type: string
          maxLength: 40
        open_jobs_count:
          type: integer
          readOnly: true
      required:
      - domain
      - name
      - open_jobs_count
      - slug
    CompanyNested:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 280
          pattern: ^[-a-zA-Z0-9_]+$
        domain:
          type: string
          maxLength: 255
        logo_url:
          type: string
          format: uri
          maxLength: 500
      required:
      - domain
      - id
      - name
      - slug
    ConductingBody:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        short_name:
          type: string
          maxLength: 50
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        body_type:
          $ref: '#/components/schemas/BodyTypeEnum'
        state:
          type: string
          maxLength: 100
        website:
          type: string
          format: uri
          maxLength: 200
        is_active:
          type: boolean
      required:
      - body_type
      - id
      - name
      - slug
    CustomTokenObtainPairRequest:
      type: object
      description: Adds ``role`` + ``email`` claims and tracks login metadata.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    DepartmentFacet:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
      required:
